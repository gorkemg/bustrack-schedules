name: Security checks
on:
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install application dependencies and auditor
        run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit application dependencies
        run: python -m pip_audit -r requirements.txt

  beta-security-check:
    # GitHub schedules execute from the default branch. Explicitly test beta.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: beta
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install beta dependencies and auditor
        run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - name: Test beta
        run: python -m unittest discover -s tests -v
      - name: Audit beta dependencies
        run: python -m pip_audit -r requirements.txt
