name: Security checks
on:
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install application dependencies and auditor
        run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit application dependencies
        run: python -m pip_audit -r requirements.txt

  staging-security-check:
    # GitHub schedules execute from the default branch. Explicitly test the staging pointer.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install staging dependencies and auditor
        run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - name: Test staging
        run: python -m unittest discover -s tests -v
      - name: Audit staging dependencies
        run: python -m pip_audit -r requirements.txt

  artifact-roundtrip:
    name: artifact-roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create bounded multi-file fixture
        run: |
          mkdir -p fixture
          printf '%s\n' '{"fixture":true}' > fixture/first.json
          printf '%s\n' 'artifact roundtrip' > fixture/second.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-roundtrip
          path: fixture/*
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maintenance-roundtrip
          path: restored
      - name: Verify filenames and exact bytes after extraction
        run: |
          cmp fixture/first.json restored/first.json
          cmp fixture/second.tar.gz restored/second.tar.gz
          test "$(find restored -type f | wc -l)" -eq 2
