name: Security checks
on:
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install application dependencies and auditor
        run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit application dependencies
        run: python -m pip_audit -r requirements.txt
