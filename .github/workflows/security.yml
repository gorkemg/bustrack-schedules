name: Security checks
on:
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install application dependencies and auditor
        run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit application dependencies
        run: python -m pip_audit -r requirements.txt

  beta-security-check:
    # GitHub schedules execute from the default branch. Explicitly test beta.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: beta
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install beta dependencies and auditor
        run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - name: Test beta
        run: python -m unittest discover -s tests -v
      - name: Audit beta dependencies
        run: python -m pip_audit -r requirements.txt
