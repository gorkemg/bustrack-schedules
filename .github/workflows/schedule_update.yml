name: Update Transit Schedules

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'src/**'
      - '.github/workflows/schedule_update.yml'
      - 'requirements.txt'
  schedule:
    # 00:00 UTC on the 1st of every month (runs on default branch: main)
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schedule-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-schedules:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pip-audit==2.10.1

      - name: Audit application dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # ── UTA ────────────────────────────────────────────────────────────────

      - name: Fetch and Extract Current UTA GTFS Feed
        id: uta_gtfs
        continue-on-error: true
        run: |
          python src/fetch_gtfs_routes.py "https://apps.rideuta.com/tms/gtfs/Static" data/uta/routes.txt

      - name: Run UTA parser
        if: steps.uta_gtfs.outcome == 'success'
        id: uta_parser
        continue-on-error: true
        run: python src/uta_parser.py

      # ── PVTA ───────────────────────────────────────────────────────────────

      - name: Fetch and Extract Current PVTA GTFS Feed
        id: pvta_gtfs
        continue-on-error: true
        run: |
          python src/fetch_gtfs_routes.py "https://www.pvta.com/g_trans/google_transit.zip" data/pvta/routes.txt

      - name: Run PVTA parser
        if: steps.pvta_gtfs.outcome == 'success'
        id: pvta_parser
        continue-on-error: true
        run: python src/pvta_parser.py

      # ── Gate ───────────────────────────────────────────────────────────────

      - name: Enforce Workflow Status
        if: always()
        run: |
          FAILED=0
          [[ "${{ steps.uta_gtfs.outcome }}"   == "failure" ]] && FAILED=1
          [[ "${{ steps.uta_parser.outcome }}"  == "failure" ]] && FAILED=1
          [[ "${{ steps.pvta_gtfs.outcome }}"  == "failure" ]] && FAILED=1
          [[ "${{ steps.pvta_parser.outcome }}" == "failure" ]] && FAILED=1
          if [[ $FAILED -eq 1 ]]; then
            echo "Error: One or more critical ETL steps failed. Failing the workflow to trigger notification."
            exit 1
          fi

      - name: Validate generated schedule artifacts
        run: python3 src/validate_artifacts.py output

      - name: Upload schedule artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schedules
          path: |
            output/uta_schedules.json
            output/pvta_schedules.json
          if-no-files-found: error
          retention-days: 1

  publish-schedules:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta'
    needs: build-schedules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout validation code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download schedule artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: schedules
          path: output

      - name: Validate downloaded schedule artifacts
        run: python3 src/validate_artifacts.py output

      - name: Publish to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Rolling release strategy: one release per agency per environment.
          #   main  → tags: uta,      pvta
          #   beta  → tags: uta-beta, pvta-beta
          if [ "$BRANCH" == "main" ]; then
            UTA_TAG="uta"
            PVTA_TAG="pvta"
            PRERELEASE=""
          elif [ "$BRANCH" == "beta" ]; then
            UTA_TAG="uta-beta"
            PVTA_TAG="pvta-beta"
            PRERELEASE="--prerelease"
          else
            echo "Unsupported branch: $BRANCH" >&2
            exit 1
          fi

          _ensure_release() {
            local tag="$1"
            local title="$2"
            if ! gh release view "$tag" > /dev/null 2>&1; then
              echo "Creating release: $tag"
              gh release create "$tag" $PRERELEASE \
                --title "$title" \
                --notes "Automated schedule artifacts generated via CI/CD pipeline."
            fi
          }

          _ensure_release "$UTA_TAG"  "UTA Transit Schedules"
          _ensure_release "$PVTA_TAG" "PVTA Transit Schedules"

          echo "Uploading uta_schedules.json → $UTA_TAG"
          gh release upload "$UTA_TAG" output/uta_schedules.json --clobber

          echo "Uploading pvta_schedules.json → $PVTA_TAG"
          gh release upload "$PVTA_TAG" output/pvta_schedules.json --clobber
