name: Update Transit Schedules

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'src/**'
      - '.github/workflows/**'
      - 'requirements.txt'
  schedule:
    # 00:00 UTC on the 1st of every month (runs on default branch: main)
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-schedules:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and Extract Current UTA GTFS Feed
        id: uta_gtfs
        continue-on-error: true
        run: |
          mkdir -p data/uta
          curl -fsSL "https://apps.rideuta.com/tms/gtfs/Static" -o uta_gtfs.zip
          unzip -o uta_gtfs.zip routes.txt -d data/uta/
          rm uta_gtfs.zip

      - name: Run UTA parser
        if: steps.uta_gtfs.outcome == 'success'
        id: uta_parser
        continue-on-error: true
        run: python src/uta_parser.py

      - name: Run PVTA parser
        if: always()
        id: pvta_parser
        continue-on-error: true
        run: python src/pvta_parser.py

      - name: Enforce Workflow Status
        if: always()
        run: |
          FAILED=0
          [[ "${{ steps.uta_gtfs.outcome }}"   == "failure" ]] && FAILED=1
          [[ "${{ steps.uta_parser.outcome }}"  == "failure" ]] && FAILED=1
          [[ "${{ steps.pvta_parser.outcome }}" == "failure" ]] && FAILED=1
          if [[ $FAILED -eq 1 ]]; then
            echo "Error: One or more critical ETL steps failed. Failing the workflow to trigger notification."
            exit 1
          fi

      - name: Publish to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Rolling release strategy: one release per agency per environment.
          #   main  → tags: uta,      pvta
          #   beta  → tags: uta-beta, pvta-beta
          if [ "${{ github.ref_name }}" == "main" ]; then
            UTA_TAG="uta"
            PVTA_TAG="pvta"
            PRERELEASE=""
          else
            BRANCH="${{ github.ref_name }}"
            UTA_TAG="uta-${BRANCH}"
            PVTA_TAG="pvta-${BRANCH}"
            PRERELEASE="--prerelease"
          fi

          _ensure_release() {
            local tag="$1"
            local title="$2"
            if ! gh release view "$tag" > /dev/null 2>&1; then
              echo "Creating release: $tag"
              gh release create "$tag" $PRERELEASE \
                --title "$title" \
                --notes "Automated schedule artifacts generated via CI/CD pipeline."
            fi
          }

          _ensure_release "$UTA_TAG"  "UTA Transit Schedules"
          _ensure_release "$PVTA_TAG" "PVTA Transit Schedules"

          echo "Uploading uta_schedules.json → $UTA_TAG"
          gh release upload "$UTA_TAG" output/uta_schedules.json --clobber

          echo "Uploading pvta_schedules.json → $PVTA_TAG"
          gh release upload "$PVTA_TAG" output/pvta_schedules.json --clobber
